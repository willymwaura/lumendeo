{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link to external CSS file -->
    <style>
        .payment-modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    padding: 20px;
    animation: fadeIn 0.3s ease-out;
}

.modal-content {
    background: linear-gradient(135deg, #1a1a1a, #000);
    border-radius: 10px;
    width: 100%; max-width: 500px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
    position: relative;
    animation: slideUp 0.3s ease-out;
    max-height: 90vh;
    overflow-y: auto;
}

.close-modal {
    position: absolute;
    top: 15px; right: 15px;
    background: none; border: none;
    color: #d4af37; font-size: 24px;
    cursor: pointer;
}

.modal-body h3 {
    color: #d4af37;
    text-align: center;
    margin-bottom: 25px;
    font-size: 1.8rem;
}

.payment-amount {
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid #d4af37;
    border-radius: 5px;
    padding: 15px;
    text-align: center;
    margin-bottom: 25px;
}
.payment-amount h4 {
    color: #d4af37;
    margin: 10px 0;
    font-size: 1.3rem;
}
.payment-amount p {
    color: white;
    font-size: 0.95rem;
}
.payment-amount span {
    color: #d4af37;
    font-weight: bold;
}

.payment-tabs {
    display: flex;
    border-bottom: 1px solid #333;
    margin-bottom: 20px;
}
.tab-btn {
    flex: 1;
    padding: 12px 5px;
    background: none;
    border: none;
    color: #999;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
}
.tab-btn.active {
    color: #d4af37;
    border-bottom: 2px solid #d4af37;
}

.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    color: #d4af37;
    margin-bottom: 8px;
    font-size: 0.95rem;
}
.form-group input {
    width: 100%;
    padding: 12px;
    background: #222;
    border: 1px solid #444;
    border-radius: 4px;
    color: white;
    font-size: 0.95rem;
}
.form-group input:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3);
}

.form-row {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

button[type="submit"] {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #d4af37, #c27c0e);
    border: none;
    border-radius: 4px;
    color: black;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    font-size: 0.95rem;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
button[type="submit"]:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
}

.secure-msg {
    text-align: center;
    color: #777;
    margin-top: 20px;
    font-size: 0.85rem;
    line-height: 1.4;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

/* Responsive */
@media (max-width: 576px) {
    .modal-content {
        padding: 25px 15px;
    }
    .payment-tabs {
        flex-direction: column;
    }
    .tab-btn {
        text-align: left;
        border-bottom: none;
        border-left: 2px solid transparent;
        padding-left: 15px;
    }
    .tab-btn.active {
        border-left: 2px solid #d4af37;
    }
}
/* Existing mobile responsiveness (extended) */
@media (max-width: 576px) {
    .modal-content {
        padding: 20px 15px;
        max-height: 95vh;
    }

    .modal-body h3 {
        font-size: 1.4rem;
    }

    .payment-amount p {
        font-size: 0.85rem;
    }

    .payment-amount h4 {
        font-size: 1.1rem;
    }

    .form-group label,
    .form-group input,
    button[type="submit"] {
        font-size: 0.9rem;
    }

    .form-group input {
        padding: 10px;
    }

    button[type="submit"] {
        padding: 10px;
    }

    .payment-tabs {
        flex-direction: column;
        gap: 10px;
    }

    .tab-btn {
        text-align: left;
        padding: 10px 15px;
        font-size: 0.9rem;
    }

    .tab-btn.active {
        border-left: 3px solid #d4af37;
        border-bottom: none;
    }

    .close-modal {
        top: 10px;
        right: 10px;
        font-size: 20px;
    }

    .secure-msg {
        font-size: 0.75rem;
    }
}

/* For ultra-small devices (<=400px) */
@media (max-width: 400px) {
    .modal-body h3 {
        font-size: 1.2rem;
    }

    .form-group input {
        padding: 8px;
        font-size: 0.85rem;
    }

    button[type="submit"] {
        font-size: 0.85rem;
    }

    .tab-btn {
        font-size: 0.85rem;
    }

    .secure-msg {
        font-size: 0.7rem;
    }
}


    </style>
</head>
<body>

<!-- Payment Modal -->
<div class="payment-modal" style="display: flex;">
    <div class="modal-content">
        <button class="close-modal">&times;</button>
        <div class="modal-body">
            <h3>Complete Your Purchase</h3>
            <div class="payment-amount">
             
                <p>If you have already paid for the movie, just enter your M-Pesa number you will be directed to the movie.</p>
                <p>if no payment you will be receive prompt to pay 10 kshs</p>
            </div>
            <div class="payment-options">
                <div class="payment-tabs">
                    <button class="tab-btn active" data-tab="mpesa">M-Pesa</button>
                 
                </div>
                <div id="mpesa-tab" class="tab-content" style="display: block;">
                    <form id="mpesa-form" method="POST" action="{% url 'mpesa_checkout' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="phone">M-Pesa Phone Number</label>
                            <input type="tel" name="phone" id="phone" placeholder="e.g. 0712345678" required>
                        </div>
                        <input type="hidden" name="amount" value="10">
                        <button type="submit">Check Payment</button>
                    </form>
                </div>
            </div>
            <p class="secure-msg">Your payment is secure and encrypted</p>
        </div>
    </div>
</div>

</body>
</html>
