{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="{{ movie.description|default:'Watch our featured video of the month.' }}">
    <meta property="og:title" content="{{ movie.title }}">
    <meta property="og:image" content="{{ thumbnail_url }}">
    <meta property="og:type" content="video.other">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: black;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background-color: black;
        }
    </style>
</head>
<body>

<video
    id="moviePlayer"
    src="{{ video_url }}"
    controls
    autoplay
    preload="auto"
    playsinline
    poster="{{ thumbnail_url }}"
    aria-label="Video player: {{ movie.title }}"
    title="{{ movie.title }}"
    tabindex="0"
    controlsList="nodownload noremoteplayback"
/>
    Your browser does not support the video tag.
</video>

<script>
    const video = document.getElementById('moviePlayer');
    let hasEnteredFullscreen = false;

    function isMobile() {
        return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    }

    video.addEventListener('play', async () => {
        if (!hasEnteredFullscreen && isMobile()) {
            hasEnteredFullscreen = true;
            try {
                if (video.requestFullscreen) {
                    await video.requestFullscreen();
                }

                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (err) {
                console.warn('Fullscreen/orientation lock failed:', err);
            }
        }
    });

    const unlockOrientation = () => {
        if (screen.orientation?.unlock) {
            screen.orientation.unlock();
        }
        if (document.fullscreenElement) {
            document.exitFullscreen();
        }
    };

    // Optional: Unlock orientation on pause or end
    video.addEventListener('pause', unlockOrientation);
    video.addEventListener('ended', unlockOrientation);

    // Reset flag if user exits fullscreen manually
    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
            hasEnteredFullscreen = false;
        }
    });
</script>

</body>
</html>
