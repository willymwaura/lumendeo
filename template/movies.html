<!-- movie.html -->
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ movie.title }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe 
        src="https://www.youtube.com/embed/{{ movie.video_url|slice:'-11:' }}?autoplay=1&rel=0"
        title="YouTube video player"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>
</body>
</html>
