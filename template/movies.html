<!-- movie.html -->
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{{ movie.title }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background-color: black;
        }
    </style>
</head>
<body>
    <video 
        src="{{ video_url }}" 
        controls 
        autoplay 
        preload="auto"
        poster="{{thumbnail_url }}" 
        title="{{ movie.title }}">
        Your browser does not support the video tag.
    </video>
</body>
</html>
