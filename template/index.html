{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Deo TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .container {
            min-height: 100vh;
            width: 100vw;
            position: relative;
            background: url("{% static 'img/magical.jpeg' %}") no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.7));
            z-index: 1;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, #FFD700 0%, #FFA500 50%, transparent 70%);
            border-radius: 50%;
            animation: float infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1);
                opacity: 0;
            }
        }

        .main-content {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 10;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            flex-direction: row;
            overflow: hidden;
        }

        .text-content {
            flex: 0 0 35%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-left: 5%;
            order: 1;
        }

        .logo {
            width: 200px;
            height: 200px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            margin-bottom: 15px;
        }

        .video-description {
            font-size: 16px;
            line-height: 1.3;
            color: #fff;
            text-align: left;
            margin-bottom: 10px;
        }

        .video-duration {
            font-size: 16px;
            color: #FFD700;
            font-weight: 600;
            font-style: italic;
            margin-top: 10px;
        }

        .video-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 60%;
            margin-right: 5%;
            order: 2;
        }

        .video-title {
            font-size: 28px;
            font-weight: 600;
            color: #FFD700;
            margin-bottom: 15px;
            text-align: center;
        }

        .video-container {
            width: 100%;
            position: relative;
        }

        .video-thumbnail {
            width: 100%;
            height: 65vh;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-player {
            width: 100%;
            height: 65vh;
            display: none;
        }

        .play-button {
            background: linear-gradient(to right, #FFD700, #FFA500);
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .payment-cta {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
        }

        .mobile-logo-container {
            display: none;
            justify-content: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .mobile-logo {
            width: 120px;
            height: 120px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        @media (max-width: 1200px) {
            .main-content {
                flex-direction: column;
                padding: 0;
                justify-content: flex-start;
            }

            .video-section {
                max-width: 100%;
                margin: 0;
                padding: 10px;
                order: 1;
            }

            .text-content {
                width: 100%;
                margin: 0;
                padding: 10px 20px;
                order: 2;
                align-items: center;
                text-align: center;
            }

            .video-thumbnail, .video-player {
                height: 40vh;
            }

            .desktop-logo {
                display: none;
            }

            .mobile-logo-container {
                display: flex;
            }

            .video-description {
                text-align: center;
                margin-top: 5px;
                font-size: 15px;
            }
        }

        @media (max-width: 768px) {
            .video-thumbnail, .video-player {
                height: 35vh;
            }

            .play-button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .mobile-logo {
                width: 100px;
                height: 100px;
            }

            .video-title {
                font-size: 24px;
                margin-bottom: 10px;
            }
        }

        @media (max-width: 480px) {
            .video-thumbnail, .video-player {
                height: 30vh;
            }

            .mobile-logo {
                width: 80px;
                height: 80px;
            }

            .video-description {
                font-size: 14px;
                line-height: 1.2;
            }
        }

        /* [Rest of your existing CSS styles remain unchanged] */
    </style>
</head>
<body>
    <div class="container">
        <div class="particles" id="particles"></div>

        <div class="main-content">
            <div class="mobile-logo-container">
                <img src="{% static 'img/logo.png' %}" alt="Lumen Deo TV Logo" class="mobile-logo">
            </div>

            <div class="video-section">
                <h2 class="video-title" style="color: #fff;">Video Of The Month</h2>
                <div class="video-container">
                    <div class="video-thumbnail" id="videoThumbnail">
                        <img src="{{ thumbnail_url }}" alt="Thumbnail">
                        <button class="play-button" id="playButton">
                            PLAY <i class="fas fa-play"></i>
                        </button>
                    </div>
                    
                    <video class="video-player" id="videoPlayer" style="display:none;" preload="auto" controls>
                        <source src="{{ trailer_url }}" type="video/mp4">
                    </video>
                    
                    <div class="payment-cta" id="paymentCTA">
                        <h3 class="payment-cta-title">To watch full video</h3>
                        <p class="payment-cta-subtitle">PAY KES 10/-</p>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/M-PESA_LOGO-01.svg/1200px-M-PESA_LOGO-01.svg.png" alt="M-Pesa" class="mpesa-logo">
                        <button class="pay-now-btn" id="payNowBtn">
                            PAY NOW
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-content">
                <img src="{% static 'img/logo.png' %}" alt="Lumen Deo TV Logo" class="logo desktop-logo">
                <div class="video-description">
                    {% for chunk in intro_chunks %}
                        <span>{{ chunk }}</span>
                    {% endfor %}
                </div>
                <div class="video-duration">{{ latest_video.length}} Hours</div>
            </div>
        </div>
    </div>

    <!-- [Rest of your existing HTML remains unchanged] -->

    <script>
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 8 + 4;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 7 + 8) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            document.getElementById("playButton").addEventListener("click", function() {
                const thumbnail = document.getElementById('videoThumbnail');
                const videoPlayer = document.getElementById('videoPlayer');
                
                thumbnail.style.opacity = '0';
                
                setTimeout(() => {
                    thumbnail.style.display = 'none';
                    videoPlayer.style.display = 'block';
                    videoPlayer.play().catch(err => console.log('Autoplay error:', err));
                }, 300);

                videoPlayer.onended = function() {
                    document.getElementById('paymentCTA').style.display = 'flex';
                };
            });

            document.getElementById('payNowBtn').addEventListener('click', function() {
                document.getElementById('paymentModal').classList.add('active');
                document.body.style.overflow = 'hidden';
            });
        });

        // [Rest of your existing JavaScript remains unchanged]
    </script>
</body>
</html>
